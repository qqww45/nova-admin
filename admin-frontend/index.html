<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内联 SVG favicon：复用 components/BrandMark.vue 的同款几何 N + 光点，
         避免浏览器默认请求 /favicon.ico 导致 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231d4ed8'/%3E%3Cstop offset='100%25' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 22 L9 10 L12 10 L20 19 L20 10 L23 10 L23 22 L20 22 L12 13 L12 22 Z' fill='white'/%3E%3Ccircle cx='20' cy='6' r='1.6' fill='white'/%3E%3C/svg%3E"
    />
    <title>NOVA ADMIN</title>
    <script>
      /**
       * 主题预加载脚本（必须内联且同步执行）。
       *
       * 目的：在首帧渲染前确定主题，避免"先白屏闪一下亮色、再变暗"的闪烁问题。
       * 逻辑：读取本地主题设置 → 若未设置则跟随系统 → 在 <html> 上打 class 与 data-theme，
       *      后续由 CSS 变量（src/styles/theme.css）驱动全局配色。
       */
      (function () {
        try {
          var saved = localStorage.getItem('admin-theme') || 'auto';
          var isDark =
            saved === 'dark' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
