## =============================================================================
## 通用后端管理系统 - 主配置
## 说明：
##   1. 环境隔离：dev(SQLite) / prod(MySQL|PostgreSQL)，通过 spring.profiles.active 切换；
##   2. 所有敏感配置（JWT 密钥、数据库密码、允许的跨域来源）均支持环境变量注入，
##      格式 ${ENV:默认值}；开发环境默认值仅用于本地联调，生产必须通过环境变量覆盖。
## =============================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    # 统一上下文路径，前端代理 /api -> http://localhost:8080
    context-path: /
  error:
    # 发生异常时不返回堆栈（安全要求：生产禁止暴露堆栈）
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: admin-backend
  ## Redis：仅当 admin.cache.type=redis 时才会真正使用。
  ## 单机部署（memory）即使这里留空也不会连接 Redis，不影响启动。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      connect-timeout: 3s
  profiles:
    # 默认不激活任何 profile：忘记设置 SPRING_PROFILES_ACTIVE 时落在"最安全"的配置上
    # （验证码不回传、邮件通道），而不是落在开发配置上。开发请显式激活 dev。
    active: ${SPRING_PROFILES_ACTIVE:}
  jackson:
    # 时间统一字符串格式，前后端零歧义
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 反序列化时遇到未知字段不报错，提升前后端字段演进的兼容性
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 数据源与 Flyway、MyBatis-Plus 的具体配置见 application-{profile}.yml
  # ---------------------------- 邮件服务（一次性验证码） ----------------------------
  # 仅当 admin.verify.channel=email 时才会真正使用；默认 log 模式下不连邮件服务器。
  # 生产配置要点：
  #   1) host/port 按邮件商文档填写（QQ 邮箱 smtp.qq.com:465、阿里云/腾讯企业邮各有不同）；
  #   2) password 绝大多数邮件商使用"授权码"而不是登录密码（在邮箱设置里单独生成）；
  #   3) 465 端口走 SSL（mail.smtp.ssl.enable=true），587 端口走 STARTTLS（mail.smtp.starttls.enable=true）；
  #   4) 用户名/密码一律通过环境变量注入，禁止写进仓库。
  mail:
    # 注意：host 刻意不留示例默认值 —— 留了示例值会让"忘了配邮件"看起来像"配好了"，
    # 直到用户收不到验证码才暴露。留空则可在启动时被配置守卫检出（见 VerifyConfigGuard）。
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 邮件编码，避免中文主题/正文乱码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 连接/读取超时（毫秒）：避免邮件服务异常时把登录请求拖死
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: true

## ---------------------------- 日志 ----------------------------
## 文件日志统一输出到 ./logs/admin-backend.log：
##   1. 在线日志查看（GET /system/log/tail）读取的就是这个文件；
##   2. 接入 Filebeat / Vector 等采集端时，tail 同一个文件即可（只读，不冲突）。
## 生产可通过 LOG_FILE 环境变量改路径（如挂到独立磁盘）。
logging:
  file:
    name: ${LOG_FILE:./logs/admin-backend.log}
  level:
    com.example.admin: ${LOG_LEVEL_APP:info}

## ---------------------------- 自定义业务配置 ----------------------------
admin:
  # 应用版本：展示在仪表盘"系统参数"卡片上（建议由 CI 注入，或随发版手动更新）
  version: ${ADMIN_VERSION:1.0.0}
  cache:
    # 会话态存储类型：
    #   memory —— 单机部署（默认）：票据/刷新令牌/在线会话/可信设备/登录风控计数都在本进程内存里
    #   redis  —— 多实例部署：上述状态共享到 Redis，否则各实例各存一份，
    #             表现为"换台机器就不认识我"（重复验证、会话看不到、踢人不生效）
    # 默认取 memory：让单机场景开箱即用，不需要先装 Redis。
    type: ${ADMIN_CACHE_TYPE:memory}
  security:
    # JWT 密钥：HS256 要求 >= 32 字节。生产环境必须通过环境变量 JWT_SECRET 注入，
    # 并妥善保管（密钥泄漏 = 可伪造任意用户令牌）。
    jwt-secret: ${JWT_SECRET:admin-system-default-jwt-secret-please-change-in-production-32bytes}
    # Access Token 有效期（秒）：2 小时
    access-token-ttl: 7200
    # Refresh Token 有效期（秒）：7 天
    refresh-token-ttl: 604800
    # 令牌请求头前缀
    token-header: Authorization
    token-prefix: Bearer
  cors:
    # 允许的来源：禁止使用 '*'，通过环境变量配置（多个用逗号分隔）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Cache-Control
    allow-credentials: true
    max-age: 3600
  login:
    # 登录安全策略：同一账号在 retry-window-seconds 内连续失败 max-retry 次，锁定 lock-seconds 秒
    max-retry: 5
    retry-window-seconds: 300
    lock-seconds: 600
    # 同一 IP 每分钟最多请求登录接口的次数（防暴力破解）
    ip-limit-per-minute: 20
  password:
    # BCrypt 强度（10 兼顾安全与性能，每 +1 耗时翻倍）
    bcrypt-strength: 10
  captcha:
    # 图形验证码有效期（秒）
    expire-seconds: 120
    # 验证码字符类型：数字+字母，去掉 0/O/1/I/l 等易混淆字符
    code-length: 4
  verify:
    # 一次性验证码下发通道：
    #   log   —— 打印到日志（仅开发；application-dev.yml 覆盖为默认）
    #   email —— 通过 SMTP 发送邮件（生产使用，需同时配置下面的 spring.mail.*）
    # 切换只需改这一个值，业务代码零改动（端口化：OneTimeCodeSender 接口）。
    #
    # 【为什么这里的默认值取"最安全"而不是"最方便"】
    # 主配置的默认值是任何未显式配置的 profile 都会落到的值。
    # 取 email 意味着"忘了配"的结果是走真实邮件通道（安全），
    # 取 log 则意味着"忘了配"的结果是验证码被打印并回传（严重漏洞）。
    # 开发环境的便利由 application-dev.yml 显式覆盖，不靠这里的默认值。
    channel: ${ADMIN_VERIFY_CHANNEL:email}
    # 是否把验证码回传给前端（前端自动填入输入框，便于自测）。
    # 风险：开启后验证码可从登录响应中直接读到，强验证形同虚设。
    # 这里默认 false（安全）；仅 application-dev.yml 显式开启；
    # 且生产 profile 启动时若检测到为 true 会直接拒绝启动（见 VerifyConfigGuard）。
    reveal-code: ${ADMIN_VERIFY_REVEAL_CODE:false}
    # 一次性验证码有效期（秒）：与邮件正文提示保持一致（单一真源）
    one-time-code-ttl-seconds: ${ADMIN_VERIFY_CODE_TTL:300}
    mail:
      # 发件人地址：留空时自动取 spring.mail.username
      from: ${MAIL_FROM:}
      # 邮件主题前缀，便于用户识别来源
      subject-prefix: ${MAIL_SUBJECT_PREFIX:[Admin]}

## ---------------------------- 监控端点 ----------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
