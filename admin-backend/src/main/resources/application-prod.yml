## =============================================================================
## 生产环境配置：MySQL
## 激活方式：mvn spring-boot:run -Pprod  或  java -jar app.jar --spring.profiles.active=prod
##
## 安全约定（违反会在启动时被 VerifyConfigGuard 拦截，而不是带病运行）：
##   1. admin.verify.channel 必须为 email（日志通道不会把验证码送达用户）；
##   2. admin.verify.reveal-code 必须为 false（否则验证码随响应返回，强验证形同虚设）；
##   3. spring.mail.* 必须配置完整，否则验证码发不出去。
## 敏感值一律通过环境变量注入，禁止写入仓库。
## =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # useSSL=true：生产必须加密传输；如数据库在内网且无证书，可改为 false 并开启网络层隔离
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_db}?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # MySQL 支持标准探活，无需自定义 connection-test-query
      auto-commit: true

  ## 数据库迁移：生产同样由 Flyway 自动执行，禁止手工改表
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 生产开启校验：迁移脚本被篡改时立即失败，避免静默跳过
    validate-on-migrate: true
    encoding: UTF-8
    # 禁止 clean：防止误删生产库
    clean-disabled: true

  ## MyBatis-Plus
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      # 生产不打印 SQL（含参数可能含敏感信息）
      log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
      jdbc-type-for-null: 'null'
    global-config:
      banner: false
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
        update-strategy: not_null

## ---------------------------- 会话态存储（生产） ----------------------------
## 生产按多实例部署考虑，默认 redis：各实例必须共享票据/令牌/会话/设备信任，
## 否则会出现"刷新令牌在这台有效、在那台无效""在线列表只看到部分会话"等问题。
## 若确实是单机生产部署，显式设置 ADMIN_CACHE_TYPE=memory 即可。
## 启动时 CacheConfigGuard 会主动 ping Redis，连不上直接拒绝启动（避免运行到一半才失败）。
admin:
  cache:
    type: ${ADMIN_CACHE_TYPE:redis}
  verify:
    # 生产一律走邮件通道（如需短信/企业 IM，实现 OneTimeCodeSender 接口即可，业务零改动）
    channel: ${ADMIN_VERIFY_CHANNEL:email}
    # 验证码绝不回传给前端
    reveal-code: ${ADMIN_VERIFY_REVEAL_CODE:false}
    one-time-code-ttl-seconds: ${ADMIN_VERIFY_CODE_TTL:300}
    mail:
      from: ${MAIL_FROM:}
      subject-prefix: ${MAIL_SUBJECT_PREFIX:[后台管理系统]}

## ---------------------------- 日志 ----------------------------
logging:
  level:
    root: warn
    com.example.admin: info
    org.flywaydb: warn
    com.zaxxer.hikari: warn
  file:
    name: ${LOG_FILE:./logs/admin-backend.log}

## ---------------------------- 接口文档（生产对外关闭） ----------------------------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true
