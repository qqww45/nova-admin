name: Release Desktop

# 桌面端发版：推送 desktop-v* 标签触发（注意与后端/前端的部署流互不影响）。
# 标签必须等于 desktop/package.json 的版本，例如版本 1.2.4 对应标签 desktop-v1.2.4。
#
# 仓库为公开仓。客户端 electron-updater 使用 github provider，匿名读取
# GitHub Releases 上的 latest.yml（Release 标签为 v<version>，由 electron-builder 创建）。
# 客户端不内置任何 Token。
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $expected = "desktop-v$version"
          if ($tag -ne $expected) {
            Write-Error "标签 $tag 与 desktop/package.json 版本不一致，应为 $expected。先改版本号、提交，再打同名标签。"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 手动 workflow_dispatch 只构建、不发版，避免未打标签就覆盖 GitHub Release
      - name: Package NSIS installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish always

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            desktop/release/latest.yml
            desktop/release/hengzhang-setup-*.exe
            desktop/release/*.blockmap
          if-no-files-found: error

  verify:
    name: Verify GitHub update feed
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch latest.yml anonymously
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          YML="https://github.com/qqww45/nova-admin/releases/download/v${VERSION}/latest.yml"
          EXE="https://github.com/qqww45/nova-admin/releases/download/v${VERSION}/hengzhang-setup-${VERSION}.exe"
          echo "校验 $YML"
          for i in $(seq 1 12); do
            CODE="$(curl -sL -o /tmp/latest.yml -w '%{http_code}' --max-time 20 "$YML" || true)"
            if [ "$CODE" = "200" ] && grep -q "version: ${VERSION}" /tmp/latest.yml; then
              echo "latest.yml 可匿名访问："
              cat /tmp/latest.yml
              EXE_CODE="$(curl -sI -L -o /dev/null -w '%{http_code}' --max-time 30 "$EXE" || true)"
              echo "安装包 HEAD HTTP $EXE_CODE"
              if [ "$EXE_CODE" != "200" ]; then
                echo "安装包尚未可下载（HTTP $EXE_CODE）：$EXE" >&2
                exit 1
              fi
              exit 0
            fi
            echo "等待 GitHub Release 就绪（$i/12）：HTTP $CODE"
            sleep 5
          done
          echo "GitHub 更新源未通：$YML" >&2
          exit 1
