name: Release Desktop

# 桌面端发版：推送 desktop-v* 标签触发（注意与后端/前端的部署流互不影响）。
# 标签必须等于 desktop/package.json 的版本，例如版本 1.2.0 对应标签 desktop-v1.2.0。
# 产物上传到本仓库 Releases，客户端 electron-updater 据此自动更新。
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $expected = "desktop-v$version"
          if ($tag -ne $expected) {
            Write-Error "标签 $tag 与 desktop/package.json 版本不一致，应为 $expected。先改版本号、提交，再打同名标签。"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish always
