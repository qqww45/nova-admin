name: Deploy Backend (Shanghai Docker)

# main 分支触发：只改后端或部署文件时才构建，避免前端提交也重启后端
on:
  push:
    branches: [main]
    paths:
      - 'admin-backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven package
        working-directory: admin-backend
        run: mvn -B -ntp -T 1C clean package -Dmaven.test.skip=true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: admin-backend/target/admin-backend.jar
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    # 防止在 scp / docker 拉取阶段无限挂起（之前挂过 1 小时）
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist

      - name: Prepare .env (only used when server has none)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://nova-admin.s.ci64.com' }}
          BASE_IMAGE: ${{ vars.BASE_IMAGE }}
          ADMIN_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET:-}" ]; then
            # 服务器已有 .env 时不需要该 secret；远程脚本会检查并给出明确提示
            echo "未配置 secrets.JWT_SECRET：若服务器上已有 ${DEPLOY_PATH:-~/nova-admin}/.env 则无影响，否则部署会失败"
            exit 0
          fi
          umask 077
          cat > .env.deploy <<EOF
          # 由 GitHub Actions 生成；服务器上已存在 .env 时不会被覆盖
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          # 生产 profile：验证码回传默认关闭、通道默认 email（application-prod.yml），
          # 启动守卫（Verify/DefaultCredential/JwtSecret/CacheConfigGuard）全部生效。
          # 配置不达标会拒绝启动——这是刻意的 fail-closed 设计。
          SPRING_PROFILES_ACTIVE=prod
          # 单机生产可用内存会话态；多实例部署请删除此行改用 Redis（REDIS_HOST/REDIS_PORT/REDIS_PASSWORD）
          ADMIN_CACHE_TYPE=memory
          # ---- 数据库与邮件：由 GitHub Secrets 注入（prod 守卫所需）----
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          # characterEncoding 必须为 UTF-8（utf8mb4 会被 Connector/J 拒绝）
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_FLYWAY_ENABLED=${{ secrets.SPRING_FLYWAY_ENABLED }}
          MANAGEMENT_HEALTH_REDIS_ENABLED=${{ secrets.MANAGEMENT_HEALTH_REDIS_ENABLED }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          ADMIN_VERSION=${ADMIN_VERSION::7}
          BASE_IMAGE=${BASE_IMAGE}
          EOF
          echo "已生成 .env.deploy（prod profile，含待补齐的 DB/MAIL 注释项）"
          echo "注意：全新服务器首次部署在 DB/MAIL 配齐并修改内置账号初始密码前，"
          echo "      后端会因安全守卫拒绝启动（fail-closed）；过渡期可在服务器 .env 显式设置"
          echo "      SPRING_PROFILES_ACTIVE=staging（弱化配置，仅限内部验收，不得承载真实数据）。"

      - name: Upload to server and restart container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-p $PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          SCP_OPTS="-P $PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "=========== 部署开始 ==========="
          echo "目标：$SSH_USER@$SSH_HOST:$PORT"
          ls -lh dist/admin-backend.jar

          # 解析真实部署目录：未配置 DEPLOY_PATH 时用该 SSH 账号的 home（避免写 /opt 没权限）
          echo "[1/4] 连接服务器、解析 home 目录..."
          REMOTE_HOME="$(timeout 60 ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'echo $HOME' 2>/dev/null || true)"
          REMOTE_HOME="${REMOTE_HOME:-/home/$SSH_USER}"
          DIR="${DEPLOY_PATH:-$REMOTE_HOME/nova-admin}"
          echo "      部署目录：$DIR"

          echo "[2/4] 创建目录..."
          if ! timeout 60 ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DIR/data' '$DIR/logs'"; then
            echo "      创建目录失败或超时（60s）" >&2
            exit 1
          fi

          # .env.deploy 只在服务器没有 .env 时才需要上传
          FILES="dist/admin-backend.jar deploy/Dockerfile deploy/docker-compose.yml"
          if [ -f .env.deploy ]; then
            FILES="$FILES .env.deploy"
          fi

          echo "[3/4] 上传文件（服务器在中国时国际链路可能较慢，超时 30 分钟）..."
          if timeout 45 ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null 2>&1"; then
            echo "      服务器有 rsync：断点续传 + 实时进度"
            # shellcheck disable=SC2086
            if ! { ok=0; for try in 1 2 3 4; do timeout 5400 rsync -e "ssh $SSH_OPTS" --partial --inplace --progress --timeout=120 $FILES "$SSH_USER@$SSH_HOST:$DIR/" && { ok=1; break; }; echo "      rsync 第 $try 次失败，10 秒后续传"; sleep 10; done; [ "$ok" = 1 ]; }; then
              echo "      上传失败或超时（1800s）：请检查服务器磁盘空间与公网带宽" >&2
              exit 1
            fi
          else
            echo "      服务器无 rsync，改用 scp"
            # shellcheck disable=SC2086
            if ! { ok=0; for try in 1 2 3 4; do timeout 5400 scp $SCP_OPTS -o Compression=no $FILES "$SSH_USER@$SSH_HOST:$DIR/" && { ok=1; break; }; echo "      scp 第 $try 次失败，10 秒后重试"; sleep 10; done; [ "$ok" = 1 ]; }; then
              echo "      上传失败或超时（1800s）：请检查服务器磁盘空间与公网带宽" >&2
              exit 1
            fi
          fi
          echo "      上传完成"

          echo "[4/4] 远程构建并启动容器（超时 20 分钟）..."
          timeout 1100 ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s -- '$DIR'" <<'REMOTE' || { echo "      远程执行失败或超时" >&2; exit 1; }
          set -euo pipefail
          DIR="$1"
          echo "[remote] 已连接服务器，工作目录 $DIR"
          cd "$DIR"
          ls -lh

          # 服务器上没有 .env 时才采用 CI 生成的那份；已存在则保持服务器配置
          if [ ! -f .env ]; then
            if [ -f .env.deploy ]; then
              mv .env.deploy .env
              chmod 600 .env
              echo "已创建 ${DIR}/.env"
            else
              echo "缺少 ${DIR}/.env，且未提供 secrets.JWT_SECRET 无法自动生成（至少需要 JWT_SECRET 与 CORS_ALLOWED_ORIGINS）" >&2
              exit 1
            fi
          else
            rm -f .env.deploy
            echo "沿用服务器已有 .env"
          fi

          # docker 访问：优先直接访问；ubuntu 这类云镜像账号通常有免密 sudo，作为兜底
          DOCKER="docker"
          if ! timeout 30 docker info >/dev/null 2>&1; then
            if timeout 30 sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo -n docker"
            else
              echo "该 SSH 账号无法访问 Docker 守护进程。请任选其一：" >&2
              echo "  1) sudo usermod -aG docker \"$SSH_USER\" 后重新登录" >&2
              echo "  2) 为该账号配置免密 sudo（ubuntu 镜像默认已支持）" >&2
              exit 1
            fi
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            COMPOSE="$DOCKER compose"
          else
            COMPOSE="$DOCKER-compose"
          fi

          # 基础镜像：先按需拉取并限时，避免 docker build 在拉取阶段无限等待
          BASE_IMG="$(awk -F= '/^BASE_IMAGE=/{print $2}' .env 2>/dev/null | tail -1)"
          BASE_IMG="${BASE_IMG:-eclipse-temurin:21-jre}"
          echo "基础镜像：$BASE_IMG"
          if ! $DOCKER image inspect "$BASE_IMG" >/dev/null 2>&1; then
            echo "本地无该镜像，开始拉取（最长 15 分钟）..."
            if ! timeout 900 $DOCKER pull "$BASE_IMG"; then
              echo "拉取失败或超时：$BASE_IMG" >&2
              echo "处理方式：给服务器配置 Docker 镜像加速（/etc/docker/daemon.json 的 registry-mirrors），" >&2
              echo "         或在服务器 .env 里设置 BASE_IMAGE=<可达的镜像地址>" >&2
              exit 1
            fi
          fi

          echo "构建并启动容器（最长 15 分钟）..."
          if ! timeout 900 $COMPOSE up -d --build --remove-orphans; then
            echo "docker compose up 失败或超时" >&2
            $COMPOSE logs --tail=80 backend >&2 || true
            exit 1
          fi
          $DOCKER image prune -f >/dev/null

          # 等健康检查通过（最多 90 秒）；服务器可能没有 curl，逐级降级
          probe() {
            if command -v curl >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null || true
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null || true
            else
              docker inspect -f '{{.State.Health.Status}}' nova-admin-backend 2>/dev/null || true
            fi
          }

          for i in $(seq 1 18); do
            OUT="$(probe)"
            case "$OUT" in
              *'"status":"UP"'*|healthy)
                echo "backend healthy: $OUT"
                exit 0
                ;;
            esac
            sleep 5
          done

          echo "后端 90 秒内未就绪，最近日志：" >&2
          $COMPOSE logs --tail=80 backend >&2
          exit 1
          REMOTE

      # 公网域名验证：域名还没接入 EdgeOne/服务器时不该让流水线失败，但日志必须看得见
      - name: Verify API domain
        continue-on-error: true
        env:
          API_URL: ${{ vars.API_URL || 'https://nova-api.s.ci64.com' }}
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            OUT="$(curl -sS --max-time 15 "$API_URL/actuator/health" || true)"
            case "$OUT" in
              *'"status":"UP"'*)
                echo "接口域名可访问：$API_URL -> $OUT"
                exit 0
                ;;
            esac
            echo "等待接口域名就绪（$i/12）：$API_URL"
            sleep 5
          done
          echo "接口域名未通：请确认 $API_URL 已解析到上海服务器（或已在 EdgeOne 配置回源），并放行 8080" >&2
          exit 1
