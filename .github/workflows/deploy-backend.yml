name: Deploy Backend (Shanghai Docker)

# main 分支触发：只改后端或部署文件时才构建，避免前端提交也重启后端
on:
  push:
    branches: [main]
    paths:
      - 'admin-backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven package
        working-directory: admin-backend
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: admin-backend/target/admin-backend.jar
          if-no-files-found: error

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist

      - name: Prepare .env (only used when server has none)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://nova-admin.s.ci64.com' }}
          ADMIN_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "未配置 secrets.JWT_SECRET（staging 启动时会强校验 JWT 密钥）" >&2
            exit 1
          fi
          umask 077
          cat > .env.deploy <<EOF
          # 由 GitHub Actions 生成；服务器上已存在 .env 时不会被覆盖
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          SPRING_PROFILES_ACTIVE=staging
          ADMIN_CACHE_TYPE=memory
          ADMIN_VERIFY_CHANNEL=log
          ADMIN_VERIFY_REVEAL_CODE=true
          ADMIN_VERSION=${ADMIN_VERSION::7}
          EOF
          echo "已生成 .env.deploy（内容不回显）"

      - name: Upload to server and restart container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          DIR="${DEPLOY_PATH:-/opt/nova-admin}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-p $PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DIR/data' '$DIR/logs'"

          scp -P "$PORT" -o StrictHostKeyChecking=accept-new \
            dist/admin-backend.jar deploy/Dockerfile deploy/docker-compose.yml .env.deploy \
            "$SSH_USER@$SSH_HOST:$DIR/"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s -- '$DIR'" <<'REMOTE'
          set -euo pipefail
          DIR="$1"
          cd "$DIR"

          # 服务器上没有 .env 时才采用 CI 生成的那份；已存在则保持服务器配置
          if [ ! -f .env ]; then
            mv .env.deploy .env
            chmod 600 .env
            echo "已创建 ${DIR}/.env"
          else
            rm -f .env.deploy
            echo "沿用服务器已有 .env"
          fi

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi

          $COMPOSE up -d --build --remove-orphans
          docker image prune -f >/dev/null

          # 等健康检查通过（最多 90 秒）；服务器可能没有 curl，逐级降级
          probe() {
            if command -v curl >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null || true
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null || true
            else
              docker inspect -f '{{.State.Health.Status}}' nova-admin-backend 2>/dev/null || true
            fi
          }

          for i in $(seq 1 18); do
            OUT="$(probe)"
            case "$OUT" in
              *'"status":"UP"'*|healthy)
                echo "backend healthy: $OUT"
                exit 0
                ;;
            esac
            sleep 5
          done

          echo "后端 90 秒内未就绪，最近日志：" >&2
          $COMPOSE logs --tail=80 backend >&2
          exit 1
          REMOTE

      # 公网域名验证：域名还没接入 EdgeOne/服务器时不该让流水线失败，但日志必须看得见
      - name: Verify API domain
        continue-on-error: true
        env:
          API_URL: ${{ vars.API_URL || 'https://nova-api.s.ci64.com' }}
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            OUT="$(curl -sS --max-time 15 "$API_URL/actuator/health" || true)"
            case "$OUT" in
              *'"status":"UP"'*)
                echo "接口域名可访问：$API_URL -> $OUT"
                exit 0
                ;;
            esac
            echo "等待接口域名就绪（$i/12）：$API_URL"
            sleep 5
          done
          echo "接口域名未通：请确认 $API_URL 已解析到上海服务器（或已在 EdgeOne 配置回源），并放行 8080" >&2
          exit 1
